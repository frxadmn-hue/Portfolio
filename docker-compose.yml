version: '3.8'

services:
  # On-Premise Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: natura_siberica_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__TELEMETRY_DISABLED=true

  # Enterprise AI Agents Gateway
  ai-agents-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: natura_siberica_agents_api
    restart: always
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=http://qdrant:6333
      - INVENTREE_URL=http://localhost:8000
      - ENVIRONMENT=production
    volumes:
      - ./artifacts_generated:/app/artifacts_generated

volumes:
  qdrant_storage:
    driver: local
